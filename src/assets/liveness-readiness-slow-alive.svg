<svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E15A5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#7F77DD">livenessVsReadiness</text>

  <!-- Server Box -->
  <rect x="330" y="80" width="140" height="40" rx="8" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.5"/>
  <text x="400" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#252529">serverX</text>

  <!-- Split paths -->
  <path d="M330 100 L190 150" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M470 100 L610 150" fill="none" stroke="#E15A5A" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Left: Liveness -->
  <rect x="50" y="160" width="320" height="130" rx="10" fill="#ffffff" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="70" y="195" font-family="monospace" font-size="16" font-weight="bold" fill="#1D9E75">livenessProbe</text>
  <text x="70" y="225" font-family="monospace" font-size="13" fill="#252529">"isTheProcessStillRunning?"</text>
  <text x="70" y="255" font-family="monospace" font-size="13" fill="#1D9E75">✓ alive → restartOnlyIfThisFails</text>

  <!-- Right: Readiness -->
  <rect x="430" y="160" width="320" height="130" rx="10" fill="#ffffff" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="450" y="195" font-family="monospace" font-size="16" font-weight="bold" fill="#EF9F27">readinessProbe</text>
  <text x="450" y="225" font-family="monospace" font-size="13" fill="#252529">"canItActuallyServeTrafficWell?"</text>
  <text x="450" y="255" font-family="monospace" font-size="13" fill="#E15A5A">✗ notReady → pullFromLbRotation</text>

  <!-- Divider line -->
  <line x1="50" y1="310" x2="750" y2="310" stroke="#e5e5e7" stroke-width="1"/>

  <!-- Slow-But-Alive Problem section -->
  <text x="400" y="340" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#EF9F27">slowButAliveProblem</text>

  <!-- Path 1: GET /health (Liveness) -->
  <rect x="50" y="370" width="700" height="50" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="70" y="400" font-family="monospace" font-size="13" font-weight="bold" fill="#1D9E75">getHealth →</text>
  <text x="180" y="400" font-family="monospace" font-size="13" fill="#252529">respondsIn5ms → passesLiveness ✓</text>
  <text x="480" y="400" font-family="monospace" font-size="11" fill="#5f5e5a">(tiny handler that just checks process is up)</text>

  <!-- Path 2: GET /orders (Readiness/Real traffic) -->
  <rect x="50" y="440" width="700" height="50" rx="8" fill="#ffffff" stroke="#E15A5A" stroke-width="1.5"/>
  <text x="70" y="470" font-family="monospace" font-size="13" font-weight="bold" fill="#E15A5A">getOrders →</text>
  <text x="180" y="470" font-family="monospace" font-size="13" fill="#252529">takes8000ms → dbPoolExhausted ✗</text>
  <text x="480" y="470" font-family="monospace" font-size="11" fill="#E15A5A">(server is technically alive but requests timeout for users)</text>
</svg>
