<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#7F77DD">howCookieBasedStickySessionsWork</text>

  <!-- Horizontal divider -->
  <line x1="40" y1="215" x2="760" y2="215" stroke="#e5e5e7" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- STEP 1 -->
  <text x="40" y="70" font-family="monospace" font-size="13" font-weight="bold" fill="#EF9F27">step1: firstRequest (noCookieYet)</text>

  <!-- Client 1 -->
  <rect x="60" y="90" width="100" height="35" rx="6" fill="#ffffff" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#252529">client</text>

  <!-- LB 1 -->
  <rect x="260" y="90" width="120" height="35" rx="6" fill="#ffffff" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="320" y="112" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#252529">loadBalancer</text>

  <!-- Server A 1 -->
  <rect x="470" y="90" width="100" height="35" rx="6" fill="#ffffff" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="520" y="112" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#252529">serverA</text>

  <path d="M165 107 L252 107" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M385 107 L462 107" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="425" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="#1D9E75">picksServer</text>

  <!-- Cookie Set Box -->
  <rect x="600" y="80" width="175" height="55" rx="6" fill="#ffffff" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="687" y="105" text-anchor="middle" font-family="monospace" font-size="11" fill="#252529">lbSetsResponseCookie</text>
  <text x="687" y="122" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1D9E75">serverId = a</text>


  <!-- STEP 2 -->
  <text x="40" y="245" font-family="monospace" font-size="13" font-weight="bold" fill="#1D9E75">step2: everyRequestAfter (cookiePresent)</text>

  <!-- Client 2 -->
  <rect x="60" y="270" width="100" height="35" rx="6" fill="#ffffff" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="110" y="292" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#252529">client</text>
  <text x="110" y="325" text-anchor="middle" font-family="monospace" font-size="11" fill="#EF9F27">cookie: serverId=a</text>

  <!-- LB 2 -->
  <rect x="260" y="270" width="120" height="35" rx="6" fill="#ffffff" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="320" y="292" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#252529">loadBalancer</text>

  <!-- Servers list 2 -->
  <rect x="470" y="260" width="100" height="35" rx="6" fill="#ffffff" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="520" y="282" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#252529">serverA</text>

  <rect x="470" y="310" width="100" height="30" rx="6" fill="#ffffff" stroke="#e5e5e7" stroke-width="1"/>
  <text x="520" y="329" text-anchor="middle" font-family="monospace" font-size="11" fill="#5f5e5a">serverB (idle)</text>

  <rect x="470" y="350" width="100" height="30" rx="6" fill="#ffffff" stroke="#e5e5e7" stroke-width="1"/>
  <text x="520" y="369" text-anchor="middle" font-family="monospace" font-size="11" fill="#5f5e5a">serverC (idle)</text>

  <path d="M165 287 L252 287" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="208" y="278" text-anchor="middle" font-family="monospace" font-size="10" fill="#EF9F27">hasCookie</text>

  <path d="M385 287 L462 282" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="425" y="268" text-anchor="middle" font-family="monospace" font-size="10" fill="#1D9E75">forcesRouteToA</text>

  <!-- Explanation bottom -->
  <rect x="60" y="395" width="680" height="40" rx="6" fill="#ffffff" stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="400" y="419" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#252529">
    affinityWinsOverRoundRobinOrLeastConnectionsWhenCookieIsPresent
  </text>
</svg>
