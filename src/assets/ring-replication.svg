<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<rect width="680" height="620" fill="#1a1a1a"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<circle cx="340" cy="260" r="190" fill="none" stroke="#888780" stroke-width="1.5" opacity="0.5"/>

<circle cx="340" cy="70" r="3" fill="#c2c0b6"/>
<text x="340" y="52" text-anchor="middle" font-family="monospace" font-size="14" fill="#c2c0b6">0 / 100</text>

<!-- Clockwise direction arc -->
<path d="M 340 70 A 190 190 0 0 1 505 180" fill="none" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Server A: position 15 -> cx=494, cy=148 -->
<circle cx="494" cy="148" r="9" fill="#1D9E75" stroke="#9FE1CB" stroke-width="1"/>
<line x1="494" y1="148" x2="560" y2="100" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="566" y="96" font-family="monospace" font-size="14" font-weight="bold" fill="#c2c0b6">Server A</text>
<text x="566" y="112" font-family="monospace" font-size="12" fill="#888780">position 15</text>

<!-- Key K: position 25 -> cx=530, cy=260 -->
<circle cx="530" cy="260" r="9" fill="#BA7517" stroke="#FAC775" stroke-width="1"/>
<line x1="530" y1="260" x2="600" y2="260" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="606" y="256" font-family="monospace" font-size="14" font-weight="bold" fill="#c2c0b6">Key K</text>
<text x="606" y="272" font-family="monospace" font-size="12" fill="#888780">position 25</text>

<!-- Server B (Primary): position 40 -> cx=452, cy=414 -->
<circle cx="452" cy="414" r="9" fill="#1D9E75" stroke="#9FE1CB" stroke-width="1"/>
<line x1="452" y1="414" x2="520" y2="470" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="526" y="466" font-family="monospace" font-size="14" font-weight="bold" fill="#c2c0b6">Server B - primary</text>
<text x="526" y="482" font-family="monospace" font-size="12" fill="#888780">position 40</text>

<!-- Server C (Secondary): position 65 -> cx=186, cy=372 -->
<circle cx="186" cy="372" r="9" fill="#1D9E75" stroke="#9FE1CB" stroke-width="1"/>
<line x1="186" y1="372" x2="120" y2="430" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="110" y="450" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#c2c0b6">Server C - secondary</text>
<text x="110" y="466" text-anchor="middle" font-family="monospace" font-size="12" fill="#888780">position 65</text>

<!-- Server D (Tertiary): position 90 -> cx=228, cy=106 -->
<circle cx="228" cy="106" r="9" fill="#1D9E75" stroke="#9FE1CB" stroke-width="1"/>
<line x1="228" y1="106" x2="170" y2="60" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="160" y="44" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#c2c0b6">Server D - tertiary</text>
<text x="160" y="60" text-anchor="middle" font-family="monospace" font-size="12" fill="#888780">position 90</text>

<!-- Primary replication path: Key K (25) -> Server B (40) -->
<path d="M 530 260 A 190 190 0 0 1 452 414" fill="none" stroke="#EF9F27" stroke-width="3" marker-end="url(#arrow-amber)"/>

<!-- Secondary and tertiary replication paths (dashed lines) -->
<path d="M 452 414 A 190 190 0 0 1 186 372" fill="none" stroke="#EF9F27" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M 186 372 A 190 190 0 0 1 228 106" fill="none" stroke="#EF9F27" stroke-width="2" stroke-dasharray="4 4"/>

<!-- Bottom label box (width adjusted to 620 to prevent text overflow) -->
<rect x="30" y="558" width="620" height="42" rx="8" fill="#2C2C2A" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="584" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#F2A623">Key K is replicated on B, C, D - the first 3 distinct servers walking clockwise</text>
</svg>
