<svg width="850" height="350" viewBox="0 0 850 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-rect { fill: #ffffff; }
    .text-main { font-family: monospace; font-size: 11px; fill: #252529; }
    .text-main-bold { font-family: monospace; font-size: 12px; font-weight: bold; fill: #252529; }
    .text-title-accent { font-family: monospace; font-size: 20px; font-weight: bold; fill: #7F77DD; }
    .text-secondary { font-family: monospace; font-size: 11px; fill: #5f5e5a; }
    .text-state-healthy { font-family: monospace; font-size: 14px; font-weight: bold; fill: #1D9E75; }
    .text-state-suspected { font-family: monospace; font-size: 14px; font-weight: bold; fill: #EF9F27; }
    .text-state-unhealthy { font-family: monospace; font-size: 14px; font-weight: bold; fill: #E15A5A; }
    
    .circle-healthy { fill: #effaf6; stroke: #1D9E75; stroke-width: 2; }
    .circle-suspected { fill: #fef8f0; stroke: #EF9F27; stroke-width: 2; }
    .circle-unhealthy { fill: #fdf5f5; stroke: #E15A5A; stroke-width: 2; }
    
    .box-explanation { fill: #f9f9fb; stroke: #7F77DD; stroke-width: 1; }
    .line-flow-blue { stroke: #7F77DD; stroke-width: 1.5; fill: none; }
    .line-flow-green { stroke: #1D9E75; stroke-width: 1.5; fill: none; }
    .line-flow-red { stroke: #E15A5A; stroke-width: 1.5; fill: none; }
    .line-flow-amber { stroke: #EF9F27; stroke-width: 1.5; fill: none; }

    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: #1a1a1a; }
      .text-main { fill: #c2c0b6; }
      .text-main-bold { fill: #c2c0b6; }
      .text-secondary { fill: #888780; }
      .circle-healthy { fill: #1b2e26; }
      .circle-suspected { fill: #2d251e; }
      .circle-unhealthy { fill: #3a1e1e; }
      .box-explanation { fill: #1e1e24; }
    }
  </style>

  <rect width="850" height="350" class="bg-rect"/>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E15A5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="45" text-anchor="middle" class="text-title-accent">nodeHealthStateMachine</text>

  <!-- State 1: healthy -->
  <circle cx="100" cy="150" r="50" class="circle-healthy"/>
  <text x="100" y="145" text-anchor="middle" class="text-state-healthy">healthy</text>
  <text x="100" y="165" text-anchor="middle" class="text-secondary">inRotation</text>

  <!-- State 2: suspected -->
  <circle cx="320" cy="150" r="50" class="circle-suspected"/>
  <text x="320" y="145" text-anchor="middle" class="text-state-suspected">suspected</text>
  <text x="320" y="165" text-anchor="middle" class="text-secondary">stillGetsTraffic</text>

  <!-- State 3: unhealthy -->
  <circle cx="540" cy="150" r="50" class="circle-unhealthy"/>
  <text x="540" y="145" text-anchor="middle" class="text-state-unhealthy">unhealthy</text>
  <text x="540" y="165" text-anchor="middle" class="text-secondary">removed</text>

  <!-- State 4: recovering -->
  <circle cx="750" cy="150" r="50" class="circle-suspected"/>
  <text x="750" y="145" text-anchor="middle" class="text-state-suspected">recovering</text>
  <text x="750" y="165" text-anchor="middle" class="text-secondary">slowStartRamp</text>

  <!-- Transition: healthy -> suspected -->
  <path d="M150 150 L260 150" fill="none" class="line-flow-amber" marker-end="url(#arrow-amber)"/>
  <text x="205" y="135" text-anchor="middle" class="text-main-bold">checksFail(1x)</text>

  <!-- Transition: suspected -> unhealthy -->
  <path d="M370 150 L480 150" fill="none" class="line-flow-red" marker-end="url(#arrow-red)"/>
  <text x="425" y="135" text-anchor="middle" class="text-main-bold">failsInTotal(3x)</text>

  <!-- Transition: unhealthy -> recovering -->
  <path d="M590 150 L690 150" fill="none" class="line-flow-green" marker-end="url(#arrow-green)"/>
  <text x="640" y="125" text-anchor="middle" class="text-main-bold">passes(2x)</text>
  <text x="640" y="140" text-anchor="middle" class="text-secondary">syntheticProbe</text>

  <!-- Transition: recovering -> healthy (loop under) -->
  <path d="M750 200 C750 280, 100 280, 100 208" fill="none" class="line-flow-green" marker-end="url(#arrow-green)"/>
  <text x="425" y="260" text-anchor="middle" class="text-state-healthy">trafficRamps (10% → 25% → 50% → 100%) → healthy</text>

  <!-- Transition: recovering -> unhealthy (loop backward above) -->
  <path d="M750 100 C750 70, 540 70, 540 92" fill="none" class="line-flow-red" marker-end="url(#arrow-red)"/>
  <text x="645" y="65" text-anchor="middle" class="text-red-tag">failsDuringRamp</text>

  <!-- Threshold description box -->
  <rect x="180" y="295" width="490" height="35" rx="6" class="box-explanation"/>
  <text x="425" y="317" text-anchor="middle" class="text-main-bold">thresholdsAreConfigurable (e.g. 2 to suspect, 3 to remove, 2 to trust again)</text>
</svg>
