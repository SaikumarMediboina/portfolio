<svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="550" rx="16" fill="#1a1a1a"/>
  
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title / Divider -->
  <line x1="400" y1="30" x2="400" y2="520" stroke="#333333" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- LEFT: ACTIVE HEALTH CHECK -->
  <text x="200" y="55" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#7F77DD">activeHealthCheck</text>
  
  <!-- Load Balancer Box -->
  <rect x="130" y="100" width="140" height="45" rx="8" fill="#252529" stroke="#7F77DD" stroke-width="2"/>
  <text x="200" y="127" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">loadBalancer</text>

  <!-- Server A -->
  <rect x="40" y="240" width="80" height="40" rx="6" fill="#1b2e26" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="80" y="265" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#9FE1CB">serverA</text>
  <text x="80" y="300" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1D9E75">200Ok</text>

  <!-- Server B -->
  <rect x="160" y="240" width="80" height="40" rx="6" fill="#1b2e26" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="200" y="265" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#9FE1CB">serverB</text>
  <text x="200" y="300" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1D9E75">200Ok</text>

  <!-- Server C -->
  <rect x="280" y="240" width="80" height="40" rx="6" fill="#3a1e1e" stroke="#E15A5A" stroke-width="1.5"/>
  <text x="320" y="265" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FFA3A3">serverC</text>
  <text x="320" y="300" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#E15A5A">timeout</text>

  <!-- Active Probes Lines -->
  <path d="M150 145 L90 230" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="95" y="180" font-family="monospace" font-size="11" fill="#888780" transform="rotate(-55, 95, 180)">getHealth</text>

  <path d="M200 145 L200 230" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="205" y="190" font-family="monospace" font-size="11" fill="#888780">getHealth</text>

  <path d="M250 145 L310 230" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="265" y="195" font-family="monospace" font-size="11" fill="#888780" transform="rotate(55, 265, 195)">getHealth</text>

  <!-- Left Explanation Box -->
  <rect x="30" y="350" width="340" height="155" rx="10" fill="#1e1e24" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="385" font-family="monospace" font-size="12" fill="#c2c0b6">
    <tspan x="50" dy="0">lbProbesEveryServerOnFixedSchedule</tspan>
    <tspan x="50" dy="22">independentOfRealUserTraffic</tspan>
    <tspan x="50" dy="22">serverCMisses3PingsInARow</tspan>
    <tspan x="50" dy="25" fill="#E15A5A" font-weight="bold">→ markedUnhealthyAndPulledOut</tspan>
  </text>


  <!-- RIGHT: PASSIVE HEALTH CHECK -->
  <text x="600" y="55" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#1D9E75">passiveHealthCheck</text>

  <!-- Client Box -->
  <rect x="530" y="90" width="140" height="40" rx="8" fill="#2d251e" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="600" y="115" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#FAC775">realClient</text>

  <!-- Load Balancer Box -->
  <rect x="530" y="180" width="140" height="40" rx="8" fill="#252529" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="600" y="205" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">loadBalancer</text>

  <!-- Client to LB connection -->
  <path d="M600 130 L600 170" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Server X -->
  <rect x="460" y="290" width="90" height="40" rx="6" fill="#1b2e26" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="505" y="315" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#9FE1CB">serverX</text>
  <text x="505" y="350" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1D9E75">requestSucceeds</text>

  <!-- Server Y -->
  <rect x="650" y="290" width="90" height="40" rx="6" fill="#3a1e1e" stroke="#E15A5A" stroke-width="1.5"/>
  <text x="695" y="315" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FFA3A3">serverY</text>
  <text x="695" y="350" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E15A5A">500ErrorReset</text>

  <!-- Routing arrows -->
  <path d="M570 220 L515 282" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M630 220 L685 282" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right Explanation Box -->
  <rect x="430" y="390" width="340" height="115" rx="10" fill="#18241f" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="450" y="420" font-family="monospace" font-size="12" fill="#c2c0b6">
    <tspan x="450" dy="0">noExtraProbeTraffic</tspan>
    <tspan x="450" dy="22">lbWatchesOutcomeOfRealRequests</tspan>
    <tspan x="450" dy="22">serverYThrowsErrorsOnLiveTraffic</tspan>
    <tspan x="450" dy="25" fill="#E15A5A" font-weight="bold">→ markedUnhealthyAndPulledOut</tspan>
  </text>
</svg>
