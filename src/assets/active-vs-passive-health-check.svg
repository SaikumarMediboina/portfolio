<svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-rect { fill: #ffffff; }
    .text-main { font-family: monospace; font-size: 13px; fill: #252529; }
    .text-title-accent { font-family: monospace; font-size: 20px; font-weight: bold; fill: #7F77DD; }
    .text-title-accent-green { font-family: monospace; font-size: 20px; font-weight: bold; fill: #1D9E75; }
    .text-box-label { font-family: monospace; font-size: 14px; font-weight: bold; fill: #ffffff; }
    .text-box-label-dark { font-family: monospace; font-size: 14px; font-weight: bold; fill: #252529; }
    .text-secondary { font-family: monospace; font-size: 11px; fill: #5f5e5a; }
    .text-green-tag { font-family: monospace; font-size: 12px; font-weight: bold; fill: #1D9E75; }
    .text-red-tag { font-family: monospace; font-size: 12px; font-weight: bold; fill: #E15A5A; }
    .box-lb { fill: #7F77DD; stroke: #7F77DD; stroke-width: 1.5; }
    .box-client { fill: #EF9F27; stroke: #EF9F27; stroke-width: 1.5; }
    .box-server-green { fill: #effaf6; stroke: #1D9E75; stroke-width: 1.5; }
    .box-server-red { fill: #fdf5f5; stroke: #E15A5A; stroke-width: 1.5; }
    .box-explanation { fill: #f9f9fb; stroke: #7F77DD; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .box-explanation-green { fill: #f9f9fb; stroke: #1D9E75; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .line-flow { stroke: #7F77DD; stroke-width: 1.5; fill: none; }
    .line-flow-amber { stroke: #EF9F27; stroke-width: 1.5; fill: none; }
    .line-flow-green { stroke: #1D9E75; stroke-width: 1.5; fill: none; }
    .line-divider { stroke: #e5e5e7; stroke-width: 2; stroke-dasharray: 5 5; }

    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: #1a1a1a; }
      .text-main { fill: #c2c0b6; }
      .text-box-label-dark { fill: #ffffff; }
      .text-secondary { fill: #888780; }
      .box-server-green { fill: #1b2e26; }
      .box-server-red { fill: #3a1e1e; }
      .box-explanation { fill: #1e1e24; }
      .box-explanation-green { fill: #18241f; }
      .line-divider { stroke: #333333; }
    }
  </style>

  <rect width="800" height="550" class="bg-rect"/>
  
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title / Divider -->
  <line x1="400" y1="30" x2="400" y2="520" class="line-divider"/>

  <!-- LEFT: ACTIVE HEALTH CHECK -->
  <text x="200" y="55" text-anchor="middle" class="text-title-accent">activeHealthCheck</text>
  
  <!-- Load Balancer Box -->
  <rect x="130" y="100" width="140" height="45" rx="8" class="box-lb"/>
  <text x="200" y="127" text-anchor="middle" class="text-box-label">loadBalancer</text>

  <!-- Server A -->
  <rect x="40" y="240" width="80" height="40" rx="6" class="box-server-green"/>
  <text x="80" y="265" text-anchor="middle" class="text-main" font-weight="bold">serverA</text>
  <text x="80" y="300" text-anchor="middle" class="text-green-tag">200Ok</text>

  <!-- Server B -->
  <rect x="160" y="240" width="80" height="40" rx="6" class="box-server-green"/>
  <text x="200" y="265" text-anchor="middle" class="text-main" font-weight="bold">serverB</text>
  <text x="200" y="300" text-anchor="middle" class="text-green-tag">200Ok</text>

  <!-- Server C -->
  <rect x="280" y="240" width="80" height="40" rx="6" class="box-server-red"/>
  <text x="320" y="265" text-anchor="middle" class="text-main" font-weight="bold">serverC</text>
  <text x="320" y="300" text-anchor="middle" class="text-red-tag">timeout</text>

  <!-- Active Probes Lines -->
  <path d="M150 145 L90 230" fill="none" class="line-flow" marker-end="url(#arrow-purple)"/>
  <text x="95" y="180" class="text-secondary" transform="rotate(-55, 95, 180)">getHealth</text>

  <path d="M200 145 L200 230" fill="none" class="line-flow" marker-end="url(#arrow-purple)"/>
  <text x="205" y="190" class="text-secondary">getHealth</text>

  <path d="M250 145 L310 230" fill="none" class="line-flow" marker-end="url(#arrow-purple)"/>
  <text x="265" y="195" class="text-secondary" transform="rotate(55, 265, 195)">getHealth</text>

  <!-- Left Explanation Box -->
  <rect x="30" y="350" width="340" height="155" rx="10" class="box-explanation"/>
  <text x="50" y="385" class="text-main">
    <tspan x="50" dy="0">lbProbesEveryServerOnFixedSchedule</tspan>
    <tspan x="50" dy="22">independentOfRealUserTraffic</tspan>
    <tspan x="50" dy="22">serverCMisses3PingsInARow</tspan>
    <tspan x="50" dy="25" fill="#E15A5A" font-weight="bold">→ markedUnhealthyAndPulledOut</tspan>
  </text>


  <!-- RIGHT: PASSIVE HEALTH CHECK -->
  <text x="600" y="55" text-anchor="middle" class="text-title-accent-green">passiveHealthCheck</text>

  <!-- Client Box -->
  <rect x="530" y="90" width="140" height="40" rx="8" class="box-client"/>
  <text x="600" y="115" text-anchor="middle" class="text-box-label">realClient</text>

  <!-- Load Balancer Box -->
  <rect x="530" y="180" width="140" height="40" rx="8" class="box-lb"/>
  <text x="600" y="205" text-anchor="middle" class="text-box-label">loadBalancer</text>

  <!-- Client to LB connection -->
  <path d="M600 130 L600 170" fill="none" class="line-flow-amber" marker-end="url(#arrow-amber)"/>

  <!-- Server X -->
  <rect x="460" y="290" width="90" height="40" rx="6" class="box-server-green"/>
  <text x="505" y="315" text-anchor="middle" class="text-main" font-weight="bold">serverX</text>
  <text x="505" y="350" text-anchor="middle" class="text-green-tag">requestSucceeds</text>

  <!-- Server Y -->
  <rect x="650" y="290" width="90" height="40" rx="6" class="box-server-red"/>
  <text x="695" y="315" text-anchor="middle" class="text-main" font-weight="bold">serverY</text>
  <text x="695" y="350" text-anchor="middle" class="text-red-tag">500ErrorReset</text>

  <!-- Routing arrows -->
  <path d="M570 220 L515 282" fill="none" class="line-flow-green" marker-end="url(#arrow-green)"/>
  <path d="M630 220 L685 282" fill="none" class="line-flow-green" marker-end="url(#arrow-green)"/>

  <!-- Right Explanation Box -->
  <rect x="430" y="390" width="340" height="115" rx="10" class="box-explanation-green"/>
  <text x="450" y="420" class="text-main">
    <tspan x="450" dy="0">noExtraProbeTraffic</tspan>
    <tspan x="450" dy="22">lbWatchesOutcomeOfRealRequests</tspan>
    <tspan x="450" dy="22">serverYThrowsErrorsOnLiveTraffic</tspan>
    <tspan x="450" dy="25" fill="#E15A5A" font-weight="bold">→ markedUnhealthyAndPulledOut</tspan>
  </text>
</svg>
