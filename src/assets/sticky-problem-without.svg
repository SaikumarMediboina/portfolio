<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-rect { fill: #ffffff; }
    .text-main { font-family: monospace; font-size: 13px; fill: #252529; }
    .text-main-bold { font-family: monospace; font-size: 13px; font-weight: bold; fill: #252529; }
    .text-title-accent { font-family: monospace; font-size: 20px; font-weight: bold; fill: #7F77DD; }
    .text-box-label { font-family: monospace; font-size: 14px; font-weight: bold; fill: #ffffff; }
    .text-box-label-dark { font-family: monospace; font-size: 14px; font-weight: bold; fill: #252529; }
    .text-secondary { font-family: monospace; font-size: 11px; fill: #5f5e5a; }
    .text-green-tag { font-family: monospace; font-size: 12px; font-weight: bold; fill: #1D9E75; }
    .text-red-tag { font-family: monospace; font-size: 12px; font-weight: bold; fill: #E15A5A; }
    
    .box-client { fill: #2d251e; stroke: #EF9F27; stroke-width: 1.5; }
    .box-lb { fill: #252529; stroke: #7F77DD; stroke-width: 1.5; }
    .box-server-green { fill: #effaf6; stroke: #1D9E75; stroke-width: 1.5; }
    .box-server-red { fill: #fdf5f5; stroke: #E15A5A; stroke-width: 1.5; }
    .box-explanation { fill: #f9f9fb; stroke: #c2c0b6; stroke-width: 1; stroke-dasharray: 3 3; }
    
    .line-flow { stroke: #7F77DD; stroke-width: 1.5; fill: none; }
    .line-flow-green { stroke: #1D9E75; stroke-width: 1.5; fill: none; }
    .line-flow-red { stroke: #E15A5A; stroke-width: 1.5; fill: none; }

    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: #1a1a1a; }
      .text-main { fill: #c2c0b6; }
      .text-main-bold { fill: #c2c0b6; }
      .text-box-label-dark { fill: #ffffff; }
      .text-secondary { fill: #888780; }
      .box-server-green { fill: #1b2e26; }
      .box-server-red { fill: #3a1e1e; }
      .box-explanation { fill: #1e1e24; stroke: #5f5e5a; }
    }
  </style>

  <rect width="800" height="450" class="bg-rect"/>

  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E15A5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" class="text-title-accent">problemWithoutStickySessions</text>

  <!-- Client Box -->
  <rect x="330" y="70" width="140" height="40" rx="8" class="box-client"/>
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#FAC775">client</text>

  <!-- LB Box -->
  <rect x="330" y="150" width="140" height="40" rx="8" class="box-lb"/>
  <text x="400" y="175" text-anchor="middle" class="text-box-label">loadBalancer</text>

  <!-- Client to LB link -->
  <path d="M400 110 L400 142" fill="none" class="line-flow" marker-end="url(#arrow-purple)"/>

  <!-- Server A Box -->
  <rect x="120" y="240" width="200" height="60" rx="8" class="box-server-green"/>
  <text x="220" y="265" text-anchor="middle" class="text-main" font-weight="bold">serverA</text>
  <text x="220" y="285" text-anchor="middle" class="text-green-tag">sessionCreated</text>
  <text x="220" y="325" text-anchor="middle" class="text-secondary">cart = [ item1 ] (local memory)</text>

  <!-- Server B Box -->
  <rect x="480" y="240" width="200" height="60" rx="8" class="box-server-red"/>
  <text x="580" y="265" text-anchor="middle" class="text-main" font-weight="bold">serverB</text>
  <text x="580" y="285" text-anchor="middle" class="text-red-tag">noSessionFound</text>
  <text x="580" y="325" text-anchor="middle" class="text-secondary">cart = [ ] (empty) → reLogin</text>

  <!-- Routes -->
  <path d="M350 190 L240 234" fill="none" class="line-flow-green" marker-end="url(#arrow-green)"/>
  <text x="235" y="200" font-family="monospace" font-size="11" fill="#1D9E75" transform="rotate(22, 235, 200)">request1: login</text>

  <path d="M450 190 L560 234" fill="none" class="line-flow-red" marker-end="url(#arrow-red)"/>
  <text x="475" y="210" font-family="monospace" font-size="11" fill="#E15A5A" transform="rotate(-22, 475, 210)">request2: addItem</text>

  <!-- Explanation footer -->
  <rect x="50" y="365" width="700" height="50" rx="8" class="box-explanation"/>
  <text x="400" y="395" text-anchor="middle" class="text-main-bold">
    roundRobinSentRequest2ToADifferentServerThatHasNeverHeardOfThisUsersSession
  </text>
</svg>
