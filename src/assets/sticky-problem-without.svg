<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E15A5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#7F77DD">problemWithoutStickySessions</text>

  <!-- Client Box -->
  <rect x="330" y="70" width="140" height="40" rx="8" fill="#ffffff" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#252529">client</text>

  <!-- LB Box -->
  <rect x="330" y="150" width="140" height="40" rx="8" fill="#ffffff" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="400" y="175" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#252529">loadBalancer</text>

  <!-- Client to LB link -->
  <path d="M400 110 L400 142" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Server A Box -->
  <rect x="120" y="240" width="200" height="60" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="220" y="265" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#252529">serverA</text>
  <text x="220" y="285" text-anchor="middle" font-family="monospace" font-size="12" fill="#1D9E75">sessionCreated</text>
  <text x="220" y="325" text-anchor="middle" font-family="monospace" font-size="11" fill="#5f5e5a">cart = [ item1 ] (local memory)</text>

  <!-- Server B Box -->
  <rect x="480" y="240" width="200" height="60" rx="8" fill="#ffffff" stroke="#E15A5A" stroke-width="1.5"/>
  <text x="580" y="265" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#252529">serverB</text>
  <text x="580" y="285" text-anchor="middle" font-family="monospace" font-size="12" fill="#E15A5A">noSessionFound</text>
  <text x="580" y="325" text-anchor="middle" font-family="monospace" font-size="11" fill="#5f5e5a">cart = [ ] (empty) → reLogin</text>

  <!-- Routes -->
  <path d="M350 190 L240 234" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="235" y="200" font-family="monospace" font-size="11" fill="#1D9E75" transform="rotate(22, 235, 200)">request1: login</text>

  <path d="M450 190 L560 234" fill="none" stroke="#E15A5A" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="475" y="210" font-family="monospace" font-size="11" fill="#E15A5A" transform="rotate(-22, 475, 210)">request2: addItem</text>

  <!-- Explanation footer -->
  <rect x="50" y="365" width="700" height="50" rx="8" fill="#ffffff" stroke="#e5e5e7" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="400" y="395" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#252529">
    roundRobinSentRequest2ToADifferentServerThatHasNeverHeardOfThisUsersSession
  </text>
</svg>
