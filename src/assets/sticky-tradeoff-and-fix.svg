<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-rect { fill: #ffffff; }
    .text-main { font-family: monospace; font-size: 13px; fill: #252529; }
    .text-main-bold { font-family: monospace; font-size: 13px; font-weight: bold; fill: #252529; }
    .text-title-accent { font-family: monospace; font-size: 18px; font-weight: bold; fill: #7F77DD; }
    .text-box-label { font-family: monospace; font-size: 13px; font-weight: bold; fill: #ffffff; }
    .text-secondary { font-family: monospace; font-size: 11px; fill: #5f5e5a; }
    .text-red-tag { font-family: monospace; font-size: 12px; font-weight: bold; fill: #E15A5A; }
    .text-green-tag { font-family: monospace; font-size: 12px; font-weight: bold; fill: #1D9E75; }
    
    .box-client { fill: #2d251e; stroke: #EF9F27; stroke-width: 1.5; }
    .box-lb { fill: #252529; stroke: #7F77DD; stroke-width: 1.5; }
    .box-server-green { fill: #effaf6; stroke: #1D9E75; stroke-width: 1.5; }
    .box-server-red { fill: #fdf5f5; stroke: #E15A5A; stroke-width: 1.5; }
    .box-explanation-red { fill: #fdf5f5; stroke: #E15A5A; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .box-explanation-green { fill: #effaf6; stroke: #1D9E75; stroke-width: 1.5; stroke-dasharray: 4 4; }
    
    .line-flow { stroke: #7F77DD; stroke-width: 1.5; fill: none; }
    .line-flow-green { stroke: #1D9E75; stroke-width: 1.5; fill: none; }
    .line-flow-red { stroke: #E15A5A; stroke-width: 1.5; fill: none; }
    .line-flow-amber { stroke: #EF9F27; stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    .line-divider { stroke: #e5e5e7; stroke-width: 2; stroke-dasharray: 5 5; }

    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: #1a1a1a; }
      .text-main { fill: #c2c0b6; }
      .text-main-bold { fill: #c2c0b6; }
      .text-secondary { fill: #888780; }
      .box-server-green { fill: #1b2e26; }
      .box-server-red { fill: #3a1e1e; }
      .box-explanation-red { fill: #291c1c; }
      .box-explanation-green { fill: #18241f; }
      .line-divider { stroke: #333333; }
    }
  </style>

  <rect width="800" height="500" class="bg-rect"/>

  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E15A5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title / Divider -->
  <text x="400" y="35" text-anchor="middle" class="text-title-accent">stickySessionsTradeoffAndFix</text>
  <line x1="400" y1="55" x2="400" y2="480" class="line-divider"/>

  <!-- LEFT: TRADEOFF -->
  <text x="200" y="65" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#E15A5A">stickySessionsTradeoff</text>

  <!-- Client 1 -->
  <rect x="150" y="90" width="100" height="35" rx="6" class="box-client"/>
  <text x="200" y="112" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FAC775">client</text>
  <text x="200" y="145" text-anchor="middle" class="text-secondary" font-weight="bold" fill="#EF9F27">cookie: serverId=a</text>

  <!-- Server A (Crashed) -->
  <rect x="130" y="210" width="140" height="50" rx="8" class="box-server-red"/>
  <text x="200" y="235" text-anchor="middle" class="text-main" font-weight="bold">serverA</text>
  <text x="200" y="250" text-anchor="middle" class="text-red-tag">crashed ✗</text>

  <!-- Connection to crashed -->
  <path d="M200 155 L200 200" fill="none" class="line-flow-red" stroke-dasharray="3 3" marker-end="url(#arrow-red)"/>
  <text x="210" y="180" class="text-red-tag" font-size="10">cookiePointsToA</text>

  <!-- Tradeoff explanation -->
  <rect x="30" y="300" width="340" height="155" rx="10" class="box-explanation-red"/>
  <text x="50" y="335" class="text-main">
    <tspan x="50" dy="0" fill="#E15A5A" font-weight="bold">dataLossOnServerCrash</tspan>
    <tspan x="50" dy="25">sessionDataLivedOnlyOnServerA</tspan>
    <tspan x="50" dy="22">otherServersCannotReadIt</tspan>
    <tspan x="50" dy="22">userForcedToStartOver</tspan>
    <tspan x="50" dy="25" fill="#E15A5A" font-weight="bold">→ loadImbalance (canOverloadA)</tspan>
  </text>


  <!-- RIGHT: THE FIX -->
  <text x="600" y="65" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1D9E75">centralizedSessionStoreFix</text>

  <!-- Client 2 -->
  <rect x="550" y="90" width="100" height="35" rx="6" class="box-client"/>
  <text x="600" y="112" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FAC775">client</text>

  <!-- LB 2 -->
  <rect x="530" y="160" width="140" height="35" rx="6" class="box-lb"/>
  <text x="600" y="182" text-anchor="middle" class="text-box-label">loadBalancer</text>

  <!-- Server X & Y -->
  <rect x="440" y="240" width="100" height="40" rx="6" class="box-server-green"/>
  <text x="490" y="265" text-anchor="middle" class="text-main" font-weight="bold">serverX</text>

  <rect x="660" y="240" width="100" height="40" rx="6" class="box-server-green"/>
  <text x="710" y="265" text-anchor="middle" class="text-main" font-weight="bold">serverY</text>

  <!-- Shared Store -->
  <rect x="500" y="340" width="200" height="50" rx="8" class="box-client" stroke-width="2"/>
  <text x="600" y="365" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#FAC775">sharedSessionStore</text>
  <text x="600" y="380" text-anchor="middle" class="text-secondary" font-weight="bold" fill="#EF9F27">redis / memcached</text>

  <!-- Connections -->
  <path d="M600 125 L600 152" fill="none" class="line-flow" marker-end="url(#arrow-purple)"/>
  <path d="M570 195 L500 232" fill="none" class="line-flow-green" marker-end="url(#arrow-green)"/>
  <path d="M630 195 L700 232" fill="none" class="line-flow-green" marker-end="url(#arrow-green)"/>

  <path d="M490 280 L560 332" fill="none" class="line-flow-amber" marker-end="url(#arrow-amber)"/>
  <path d="M710 280 L640 332" fill="none" class="line-flow-amber" marker-end="url(#arrow-amber)"/>

  <!-- Right Explanation -->
  <rect x="430" y="410" width="340" height="75" rx="10" class="box-explanation-green"/>
  <text x="450" y="435" class="text-main">
    <tspan x="450" dy="0" fill="#1D9E75" font-weight="bold">sessionDataStoredExternally</tspan>
    <tspan x="450" dy="20">anyServerCanHandleAnyRequest</tspan>
    <tspan x="450" dy="20">zeroDataLostOnServerCrash ✓</tspan>
  </text>
</svg>
