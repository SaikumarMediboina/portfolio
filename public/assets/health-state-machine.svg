<svg width="850" height="350" viewBox="0 0 850 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="850" height="350" rx="16" fill="#1a1a1a"/>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E15A5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="45" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#7F77DD">nodeHealthStateMachine</text>

  <!-- State 1: healthy -->
  <circle cx="100" cy="150" r="50" fill="#1b2e26" stroke="#1D9E75" stroke-width="2"/>
  <text x="100" y="145" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#9FE1CB">healthy</text>
  <text x="100" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#888780">inRotation</text>

  <!-- State 2: suspected -->
  <circle cx="320" cy="150" r="50" fill="#2d251e" stroke="#EF9F27" stroke-width="2"/>
  <text x="320" y="145" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#FAC775">suspected</text>
  <text x="320" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#888780">stillGetsTraffic</text>

  <!-- State 3: unhealthy -->
  <circle cx="540" cy="150" r="50" fill="#3a1e1e" stroke="#E15A5A" stroke-width="2"/>
  <text x="540" y="145" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#FFA3A3">unhealthy</text>
  <text x="540" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#888780">removed</text>

  <!-- State 4: recovering -->
  <circle cx="750" cy="150" r="50" fill="#2d251e" stroke="#EF9F27" stroke-width="2"/>
  <text x="750" y="145" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#FAC775">recovering</text>
  <text x="750" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#888780">slowStartRamp</text>

  <!-- Transition: healthy -> suspected -->
  <path d="M150 150 L260 150" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="205" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#c2c0b6">checksFail(1x)</text>

  <!-- Transition: suspected -> unhealthy -->
  <path d="M370 150 L480 150" fill="none" stroke="#E15A5A" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="425" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#c2c0b6">failsInTotal(3x)</text>

  <!-- Transition: unhealthy -> recovering -->
  <path d="M590 150 L690 150" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="640" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="#c2c0b6">passes(2x)</text>
  <text x="640" y="140" text-anchor="middle" font-family="monospace" font-size="10" fill="#888780">syntheticProbe</text>

  <!-- Transition: recovering -> healthy (loop under) -->
  <path d="M750 200 C750 280, 100 280, 100 208" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="425" y="260" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1D9E75">trafficRamps (10% → 25% → 50% → 100%) → healthy</text>

  <!-- Transition: recovering -> unhealthy (loop backward above) -->
  <path d="M750 100 C750 70, 540 70, 540 92" fill="none" stroke="#E15A5A" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="645" y="65" text-anchor="middle" font-family="monospace" font-size="11" fill="#E15A5A">failsDuringRamp</text>

  <!-- Threshold description box -->
  <rect x="180" y="295" width="490" height="35" rx="6" fill="#1e1e24" stroke="#7F77DD" stroke-width="1"/>
  <text x="425" y="317" text-anchor="middle" font-family="monospace" font-size="11" fill="#c2c0b6">thresholdsAreConfigurable (e.g. 2 to suspect, 3 to remove, 2 to trust again)</text>
</svg>
